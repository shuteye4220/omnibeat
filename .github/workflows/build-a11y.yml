name: Build accessible APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-a11y
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk OmniBeat-a11y.apk

      - uses: actions/upload-artifact@v5
        with:
          name: OmniBeat-a11y
          path: OmniBeat-a11y.apk

      # Publishes the newest build at a fixed link: Releases > "Latest accessible build".
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. Install OmniBeat-a11y.apk; it sits alongside OmniBeat from F-Droid."
          if gh release view latest-a11y >/dev/null 2>&1; then
            # Replace the file in place so the download link never disappears mid-update.
            gh release upload latest-a11y OmniBeat-a11y.apk --clobber
            gh release edit latest-a11y --notes "$notes"
          else
            gh release create latest-a11y OmniBeat-a11y.apk \
              --title "Latest accessible build" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
